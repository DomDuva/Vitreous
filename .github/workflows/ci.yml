name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CI_PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Real Redis for the Vitreous.Caching.Redis tests (skipped when VITREOUS_TEST_REDIS is unset).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      VITREOUS_TEST_REDIS: localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs tags to compute a version

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            9.x
            10.x
            11.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity minimal

      # Packs every src/ project and verifies the source generator is laid out as an
      # analyzer (analyzers/dotnet/cs) — if it ends up under lib/ the generator never runs.
      # A fixed version (instead of MinVer's) lets the smoke test reference the packages.
      - name: Pack & verify analyzer layout
        run: |
          for proj in src/*/*.csproj; do
            dotnet pack "$proj" --configuration Release --no-build \
              -p:MinVerSkip=true \
              -p:Version=${{ env.CI_PACKAGE_VERSION }} \
              -p:PackageVersion=${{ env.CI_PACKAGE_VERSION }} \
              --output ./artifacts
          done
          unzip -l ./artifacts/Vitreous.SourceGeneration.*.nupkg | grep -q "analyzers/dotnet/cs/Vitreous.SourceGeneration.dll" \
            || { echo "::error::Vitreous.SourceGeneration.dll is not packed under analyzers/dotnet/cs"; exit 1; }

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ci-packages
          path: ./artifacts/*.nupkg
          retention-days: 3

  # Builds a consumer app against the packed nupkgs on the oldest SDK of each band. The
  # compiler silently skips a generator built against a newer Roslyn (CS9057), which unit
  # tests cannot see because they load the generator directly.
  package-smoke:
    name: Package smoke test (SDK ${{ matrix.sdk }})
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sdk: 8.0.100, tfm: net8.0 }   # oldest SDK for the oldest target (Roslyn 4.8)
          - { sdk: 9.0.100, tfm: net9.0 }   # the band that skipped the 0.2.0-beta generator
          - { sdk: 10.0.100, tfm: net10.0 }
          - { sdk: 11.0.100, tfm: net11.0 }
    defaults:
      run:
        working-directory: tests/Vitreous.PackageSmokeTest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: ci-packages
          path: ./artifacts

      - name: Pin SDK ${{ matrix.sdk }}
        run: echo '{"sdk":{"version":"${{ matrix.sdk }}","rollForward":"disable"}}' > global.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: tests/Vitreous.PackageSmokeTest/global.json

      - name: Build against the packages
        run: |
          dotnet --version
          dotnet build -c Release \
            -p:SmokeTargetFramework=${{ matrix.tfm }} \
            -p:VitreousPackageVersion=${{ env.CI_PACKAGE_VERSION }}

      - name: Run
        run: dotnet bin/Release/${{ matrix.tfm }}/Vitreous.PackageSmokeTest.dll

  # Installs the packed templates and creates a project from each one, outside the repo so its
  # Directory.Build.props and Directory.Packages.props don't apply. Each project must build with
  # warnings as errors and pass its own tests. Building also proves the source generator ran:
  # AddVitreousHandlers() only exists in generated code.
  templates:
    name: Template ${{ matrix.template }} (${{ matrix.name }})
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Defaults on every target framework
          - { template: vitreous-api, name: net8.0, args: "-f net8.0" }
          - { template: vitreous-api, name: net9.0, args: "-f net9.0" }
          - { template: vitreous-api, name: net10.0, args: "-f net10.0" }
          - { template: vitreous-api, name: net11.0, args: "-f net11.0" }
          - { template: vitreous-console, name: net8.0, args: "-f net8.0" }
          - { template: vitreous-console, name: net9.0, args: "-f net9.0" }
          - { template: vitreous-console, name: net10.0, args: "-f net10.0" }
          - { template: vitreous-console, name: net11.0, args: "-f net11.0" }
          - { template: vitreous-worker, name: net8.0, args: "-f net8.0" }
          - { template: vitreous-worker, name: net9.0, args: "-f net9.0" }
          - { template: vitreous-worker, name: net10.0, args: "-f net10.0" }
          - { template: vitreous-worker, name: net11.0, args: "-f net11.0" }
          # Options, on net10.0 (the default)
          - { template: vitreous-api, name: options off, args: "--validation false --devui false", project: My-Shop.Api }
          - { template: vitreous-api, name: no tests, args: "--tests false" }
          - { template: vitreous-api, name: caching memory, args: "--caching memory" }
          # No Redis server here: cache errors count as misses, so the tests still pass.
          - { template: vitreous-api, name: caching redis, args: "--caching redis" }
          - { template: vitreous-api, name: aot, args: "--aot --caching memory", aot: true }
          - { template: vitreous-console, name: options off, args: "--validation false", project: My-Shop.Cli }
          - { template: vitreous-console, name: no tests, args: "--tests false" }
          - { template: vitreous-worker, name: options off, args: "--validation false", project: My-Shop.Jobs }
          - { template: vitreous-worker, name: no tests, args: "--tests false" }
          - { template: vitreous-worker, name: caching memory, args: "--caching memory" }
          - { template: vitreous-worker, name: caching redis, args: "--caching redis" }

    env:
      PROJECT: ${{ matrix.project || 'Probe' }}

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: ci-packages
          path: ./artifacts

      # Every SDK, so the tests can run on the runtime the project targets.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            9.x
            10.x
            11.x

      - name: Install the templates
        run: dotnet new install ./artifacts/Vitreous.Templates.${{ env.CI_PACKAGE_VERSION }}.nupkg

      - name: Create the project
        working-directory: ${{ runner.temp }}
        run: |
          cat > nuget.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$GITHUB_WORKSPACE/artifacts" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="Vitreous" />
                <package pattern="Vitreous.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          dotnet new ${{ matrix.template }} -n "$PROJECT" --no-restore \
            --vitreous-version ${{ env.CI_PACKAGE_VERSION }} ${{ matrix.args }}
          find "$PROJECT" -type f | sort

      - name: Build
        working-directory: ${{ runner.temp }}/${{ env.PROJECT }}
        run: dotnet build -warnaserror

      - name: Test
        working-directory: ${{ runner.temp }}/${{ env.PROJECT }}
        run: |
          if [ -d tests ]; then
            dotnet test --no-build
          else
            echo "Created with --tests false: no test project."
          fi

      - name: Run the console app
        if: matrix.template == 'vitreous-console'
        working-directory: ${{ runner.temp }}/${{ env.PROJECT }}
        env:
          TodosFile: ${{ runner.temp }}/todos.json
        run: |
          app() { dotnet run --no-build --project "src/$PROJECT" -- "$@"; }
          check() { # name expected actual
            if [ "$2" != "$3" ]; then
              echo "::error::$1: expected '$2', got '$3'"; exit 1
            fi
            echo "ok   $1"
          }
          code() { app "$@" > /dev/null 2>&1 && echo 0 || echo $?; }

          check "add" "Added 1: Buy milk" "$(app add Buy milk)"
          check "done" "Completed 1, 0 left to do" "$(app done 1)"
          check "list" "  1 [x] Buy milk" "$(app list)"
          check "blank title" 2 "$(code add ' ')"
          check "not found" 1 "$(code show 42)"
          check "unknown verb" 2 "$(code nonsense)"

      # The first sample reminder is due right away. SIGTERM must end the worker with exit code 0.
      - name: Run the worker
        if: matrix.template == 'vitreous-worker'
        working-directory: ${{ runner.temp }}/${{ env.PROJECT }}
        run: |
          dll=$(find "src/$PROJECT/bin" -name "$PROJECT.dll" | head -1)
          (cd "src/$PROJECT" && DOTNET_ENVIRONMENT=Development exec dotnet "$OLDPWD/$dll") > worker.log 2>&1 &
          pid=$!
          for _ in $(seq 100); do grep -q "Review the pull request" worker.log && break; sleep 0.1; done
          kill -TERM $pid
          wait $pid || { echo "::error::the worker exited with code $?"; cat worker.log; exit 1; }

          for line in "To ada@example.com: Review the pull request" "sent, 2 pending" "Stopping, no more reminders will be sent"; do
            grep -qF "$line" worker.log || { echo "::error::'$line' is not in the log"; cat worker.log; exit 1; }
            echo "ok   $line"
          done

      - name: Publish with Native AOT and call the API
        if: matrix.aot
        working-directory: ${{ runner.temp }}/${{ env.PROJECT }}
        run: |
          dotnet publish "src/$PROJECT" -c Release -r linux-x64 -o out
          base=http://127.0.0.1:5080
          ASPNETCORE_URLS=$base "./out/$PROJECT" > app.log 2>&1 &
          for _ in $(seq 50); do curl -sf $base/todos > /dev/null && break; sleep 0.1; done

          check() { # name expected actual
            if [ "$2" != "$3" ]; then
              echo "::error::$1: expected '$2', got '$3'"; cat app.log; exit 1
            fi
            echo "ok   $1"
          }
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          id=$(curl -sf -H 'content-type: application/json' -X POST $base/todos -d '{"title":"ship it"}' | jq -r .id)
          check "create" '"ship it"' "$(curl -sf $base/todos/$id | jq .title)"
          check "blank title" 400 "$(status -H 'content-type: application/json' -X POST $base/todos -d '{"title":" "}')"
          check "complete" 204 "$(status -X POST $base/todos/$id/complete)"
          check "cache invalidated" true "$(curl -sf $base/todos/$id | jq .done)"
          check "not found" 404 "$(status $base/todos/00000000-0000-0000-0000-000000000000)"
          check "stream" '["ship it"]' "$(curl -sf $base/todos | jq -c 'map(.title)')"

  # Publishes the AOT sample with Native AOT (any trim/AOT warning fails the build, since
  # warnings are errors) and checks every endpoint of the native binary.
  aot:
    name: Native AOT (${{ matrix.tfm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [net10.0, net11.0]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.x
            11.x

      - name: Publish
        run: dotnet publish samples/Vitreous.Sample.Aot -c Release -f ${{ matrix.tfm }} -r linux-x64 -o out/aot

      - name: Smoke test
        run: |
          ls -l out/aot/Vitreous.Sample.Aot
          base=http://127.0.0.1:5080
          ASPNETCORE_URLS=$base ./out/aot/Vitreous.Sample.Aot > sample.log 2>&1 &
          for _ in $(seq 50); do curl -sf $base/health > /dev/null && break; sleep 0.1; done

          check() { # name expected actual
            if [ "$2" != "$3" ]; then
              echo "::error::$1: expected '$2', got '$3'"; cat sample.log; exit 1
            fi
            echo "ok   $1"
          }
          json() { curl -s -H 'content-type: application/json' "$@"; }
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          check "health" ok "$(curl -sf $base/health)"
          todo=$(json -X POST $base/todos -d '{"title":"ship aot"}')
          id=$(echo "$todo" | jq -r .id)
          check "command" '"ship aot"' "$(echo "$todo" | jq .title)"
          check "closed behavior" 400 "$(status -X POST $base/todos -H 'content-type: application/json' -d '{"title":" "}')"
          check "cached query (miss)" false "$(curl -sf $base/todos/$id | jq .done)"
          check "cached query (hit)" false "$(curl -sf $base/todos/$id | jq .done)"
          check "handler ran once" 1 "$(curl -sf $base/stats | jq .getTodoCalls)"
          check "void command" 204 "$(status -X POST $base/todos/$id/complete)"
          check "invalidated" true "$(curl -sf $base/todos/$id | jq .done)"
          check "failed result" 404 "$(status -X POST $base/todos/00000000-0000-0000-0000-000000000000/complete)"
          check "struct command" 5 "$(curl -sf "$base/add?a=2&b=3")"
          check "notification handlers" 1 "$(curl -sf $base/stats | jq .createdNotifications)"
          check "open-generic behavior" 8 "$(curl -sf $base/stats | jq .dispatches)"
          check "stream" '["ship aot"]' "$(curl -sf $base/todos | jq -c 'map(.title)')"
