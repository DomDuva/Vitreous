name: Publish to NuGet

# Triggers only when a version tag (e.g. v0.1.0) is pushed.
# Also supports manual re-runs from the GitHub Actions UI without re-tagging.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'   # pre-release tags: v0.1.0-beta.1
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.1.0-beta.1). The tag must already exist.'
        required: true

jobs:
  publish:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Strip the leading 'v' from the tag (v0.1.0-beta.1 → 0.1.0-beta.1).
      # For push triggers: github.ref_name is the tag (e.g. v0.1.0-beta.1).
      # For workflow_dispatch: inputs.tag is used instead.
      - name: Resolve version
        id: version
        run: |
          RAW=${{ inputs.tag || github.ref_name }}
          echo "value=${RAW#v}" >> $GITHUB_OUTPUT

      # All three SDKs so the test projects run on every target framework.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Restore dependencies
        run: dotnet restore

      # MinVerSkip=true disables MinVer's MSBuild target so it cannot override
      # the version we derive from the git tag name.
      - name: Build (Release)
        run: |
          dotnet build --configuration Release --no-restore \
            -p:MinVerSkip=true \
            -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity minimal

      # Only pack projects under src/ — samples and tests are excluded.
      # MinVerSkip=true is required here too: dotnet pack re-runs MSBuild targets
      # even with --no-build, and MinVer would otherwise override PackageVersion.
      - name: Pack
        run: |
          for proj in src/*/*.csproj; do
            dotnet pack "$proj" --configuration Release --no-build \
              -p:MinVerSkip=true \
              -p:Version=${{ steps.version.outputs.value }} \
              -p:PackageVersion=${{ steps.version.outputs.value }} \
              --output ./artifacts
          done

      # Trusted publishing: exchanges the GitHub OIDC token for a short-lived API key.
      # Requires a trusted publishing policy for this repo/workflow on nuget.org and the
      # NUGET_USER repository variable (the nuget.org profile name, not the email).
      # Until NUGET_USER is set, the NUGET_API_KEY secret is used instead.
      - name: NuGet login (OIDC)
        id: login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushing a .nupkg also pushes the matching .snupkg found next to it.
      - name: Push packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/
          retention-days: 7
