name: Publish to NuGet

# Runs when a GitHub release is published (its tag, e.g. v0.1.0, is the version).
# Also supports manual re-runs from the GitHub Actions UI for an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.1.0-beta.1). The tag must already exist.'
        required: true

jobs:
  publish:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the packages to the release
      id-token: write # NuGet trusted publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0

      # Strip the leading 'v' from the tag (v0.1.0-beta.1 → 0.1.0-beta.1).
      # A tag with a pre-release suffix must be published as a GitHub pre-release, and vice versa.
      - name: Resolve version
        id: version
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag (expected v1.2.3 or v1.2.3-beta.1)"
            exit 1
          fi
          if [[ -n "$PRERELEASE" ]]; then
            SUFFIX=false; [[ "$TAG" == *-* ]] && SUFFIX=true
            if [[ "$SUFFIX" != "$PRERELEASE" ]]; then
              echo "::error::'$TAG' and the release's pre-release flag ($PRERELEASE) disagree"
              exit 1
            fi
          fi
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      # All four SDKs so the test projects run on every target framework.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            9.x
            10.x
            11.x

      - name: Restore dependencies
        run: dotnet restore

      # MinVerSkip=true disables MinVer's MSBuild target so it cannot override
      # the version we derive from the git tag name.
      - name: Build (Release)
        run: |
          dotnet build --configuration Release --no-restore \
            -p:MinVerSkip=true \
            -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity minimal

      # Only pack projects under src/ — samples and tests are excluded.
      # MinVerSkip=true is required here too: dotnet pack re-runs MSBuild targets
      # even with --no-build, and MinVer would otherwise override PackageVersion.
      - name: Pack
        run: |
          for proj in src/*/*.csproj; do
            dotnet pack "$proj" --configuration Release --no-build \
              -p:MinVerSkip=true \
              -p:Version=${{ steps.version.outputs.value }} \
              -p:PackageVersion=${{ steps.version.outputs.value }} \
              --output ./artifacts
          done

      # Trusted publishing: exchanges the GitHub OIDC token for a short-lived API key.
      # Requires the trusted publishing policy for this repo/workflow on nuget.org and the
      # NUGET_USER repository variable (the nuget.org profile name, not the email).
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushing a .nupkg also pushes the matching .snupkg found next to it.
      - name: Push packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Attach packages to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ./artifacts/*.nupkg ./artifacts/*.snupkg --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/
          retention-days: 7
