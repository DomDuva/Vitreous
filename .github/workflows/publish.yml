name: Publish to NuGet

# Triggers only when a version tag (e.g. v0.1.0) is pushed.
# Also supports manual re-runs from the GitHub Actions UI without re-tagging.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'   # pre-release tags: v0.1.0-beta.1
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.1.0-beta.1). The tag must already exist.'
        required: true

jobs:
  publish:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Checkout without specifying ref so that fetch-depth: 0 reliably fetches
      # all history and tags. For push triggers GitHub auto-checks out the tagged
      # commit via GITHUB_SHA. For workflow_dispatch we switch below.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # fetch-tags + ref in actions/checkout is broken — tags are silently skipped.
      # This explicit fetch is the only reliable way to get tags onto the runner.
      - name: Fetch all tags
        run: git fetch --tags --force

      # For workflow_dispatch the default checkout lands on the default branch.
      # Switch to the requested tag so MinVer sees it as the current commit.
      - name: Switch to requested tag
        if: github.event_name == 'workflow_dispatch'
        run: git checkout ${{ inputs.tag }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity minimal

      # Only pack projects under src/ — samples and tests are excluded.
      - name: Pack
        run: |
          for proj in src/*/*.csproj; do
            dotnet pack "$proj" --configuration Release --no-build --output ./artifacts
          done

      - name: Push packages to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push ./artifacts/*.snupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/
          retention-days: 7
